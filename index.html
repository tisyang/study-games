<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>乐学萌岛 - 儿童趣味学习乐园</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/preschool.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航与成就状态栏 -->
    <header class="top-navbar">
      <div class="nav-left">
        <button id="btn-home" class="icon-btn" title="返回主页" style="display: none;">🏠</button>
        <div class="brand-badge">🏝️ <span>乐学萌岛</span></div>
      </div>
      <div class="nav-right">
        <div class="badge-item star" title="收集到的星星">⭐ <span id="star-count">0</span></div>
        <div id="combo-badge" class="badge-item combo" style="display: none;" title="连续答对">🔥 <span id="combo-count">0</span>连击</div>
        <button id="btn-toggle-sfx" class="icon-btn" title="开关音效">🔔</button>
        <button id="btn-toggle-bgm" class="icon-btn" title="开关背景音乐">🎵</button>
      </div>
    </header>

    <!-- 视图 1: 乐学萌岛·一级总大厅 (学科岛屿分类) -->
    <main id="view-main-lobby" class="view">
      <div class="hero-banner">
        <h1>今天想玩什么？</h1>
      </div>

      <div class="island-grid">
        <!-- 入口 1: 数学 - 动物小帮手 (松鼠与苹果) -->
        <button type="button" class="island-card math" id="card-goto-math" aria-label="数学：动物小帮手">
          <span class="island-badge">数学</span>
          <div class="island-scene math-scene" aria-hidden="true">
            <svg class="scene-illustration" viewBox="0 0 220 120" preserveAspectRatio="xMidYMid meet">
              <rect width="220" height="120" rx="16" fill="#e0f2fe"/>
              <ellipse cx="170" cy="28" rx="20" ry="12" fill="#ffffff" opacity="0.85"/>
              <ellipse cx="185" cy="24" rx="16" ry="10" fill="#ffffff" opacity="0.85"/>
              <path d="M-10 120 Q50 70 120 85 T230 75 L230 120 Z" fill="#bbf7d0"/>
              <path d="M-10 120 Q70 92 140 88 T230 96 L230 120 Z" fill="#86efac"/>
              <rect x="36" y="55" width="12" height="45" rx="4" fill="#a16207"/>
              <circle cx="42" cy="45" r="28" fill="#22c55e"/>
              <circle cx="26" cy="50" r="18" fill="#16a34a"/>
              <circle cx="58" cy="50" r="18" fill="#15803d"/>
              <circle cx="32" cy="40" r="5" fill="#ef4444"/>
              <circle cx="48" cy="35" r="5" fill="#ef4444"/>
              <circle cx="40" cy="55" r="5" fill="#ef4444"/>
              <circle cx="54" cy="48" r="5" fill="#ef4444"/>
              <path d="M152 92 L176 92 L172 106 L156 106 Z" fill="#b45309"/>
              <path d="M154 92 C154 82 174 82 174 92" stroke="#92400e" stroke-width="2" fill="none"/>
              <circle cx="160" cy="90" r="4.5" fill="#ef4444"/>
              <circle cx="168" cy="90" r="4.5" fill="#ef4444"/>
              <circle cx="164" cy="84" r="4.5" fill="#ef4444"/>
              <text x="110" y="98" font-size="44" text-anchor="middle">🐿️</text>
              <text x="132" y="88" font-size="22" text-anchor="middle">🍎</text>
            </svg>
          </div>
          <span class="island-title">动物小帮手</span>
        </button>

        <!-- 入口 2: 语文 - 故事与古诗 (故事绘本) -->
        <button type="button" class="island-card chinese" id="card-goto-chinese" aria-label="语文：故事与古诗">
          <span class="island-badge">语文</span>
          <div class="island-scene chinese-scene" aria-hidden="true">
            <svg class="scene-illustration" viewBox="0 0 220 120" preserveAspectRatio="xMidYMid meet">
              <rect width="220" height="120" rx="16" fill="#f3e8ff"/>
              <path d="M-10 120 Q60 75 130 90 T230 78 L230 120 Z" fill="#e9d5ff"/>
              <path d="M-10 120 Q80 95 150 90 T230 98 L230 120 Z" fill="#d8b4fe"/>
              <path d="M42 22 A18 18 0 1 0 54 44 A14 14 0 1 1 42 22 Z" fill="#fde047"/>
              <path d="M165 24 Q168 28 172 28 Q168 28 165 32 Q165 28 161 28 Q165 28 165 24 Z" fill="#eab308"/>
              <path d="M190 42 Q192 45 195 45 Q192 45 190 48 Q190 45 187 45 Q190 45 190 42 Z" fill="#f59e0b"/>
              <path d="M60 98 Q110 92 110 92 Q110 92 160 98 L168 76 Q110 70 110 70 Q110 70 52 76 Z" fill="#a855f7" opacity="0.3"/>
              <text x="110" y="88" font-size="46" text-anchor="middle">📖</text>
              <text x="156" y="68" font-size="26" text-anchor="middle">🎨</text>
              <text x="68" y="72" font-size="24" text-anchor="middle">✨</text>
              <text x="110" y="46" font-size="22" text-anchor="middle">🌸</text>
            </svg>
          </div>
          <span class="island-title">故事与古诗</span>
        </button>

        <!-- 入口 3: 英语 - 动物求助啦 (雨中的兔子) -->
        <button type="button" class="island-card english" id="card-goto-english" aria-label="英语：动物求助啦">
          <span class="island-badge">英语</span>
          <div class="island-scene english-scene" aria-hidden="true">
            <svg class="scene-illustration" viewBox="0 0 220 120" preserveAspectRatio="xMidYMid meet">
              <rect width="220" height="120" rx="16" fill="#ccfbf1"/>
              <path d="M-10 120 Q60 82 130 92 T230 84 L230 120 Z" fill="#99f6e4"/>
              <path d="M-10 120 Q80 96 150 94 T230 100 L230 120 Z" fill="#5eead4"/>
              <ellipse cx="60" cy="30" rx="26" ry="14" fill="#94a3b8" opacity="0.8"/>
              <ellipse cx="80" cy="25" rx="20" ry="12" fill="#cbd5e1" opacity="0.9"/>
              <ellipse cx="44" cy="32" rx="16" ry="10" fill="#cbd5e1" opacity="0.9"/>
              <line x1="45" y1="50" x2="40" y2="60" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="65" y1="48" x2="60" y2="58" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="82" y1="52" x2="77" y2="62" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="160" y1="36" x2="155" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="180" y1="42" x2="175" y2="54" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
              <text x="110" y="98" font-size="44" text-anchor="middle">🐰</text>
              <text x="136" y="66" font-size="34" text-anchor="middle">☂️</text>
              <text x="75" y="80" font-size="22" text-anchor="middle">💧</text>
            </svg>
          </div>
          <span class="island-title">动物求助啦</span>
        </button>
      </div>
      <button type="button" id="card-goto-preschool" class="preschool-entry">
        <span class="preschool-entry-art" aria-hidden="true">🐻 🚌</span>
        <span><strong>小小乐园</strong><small>4—5岁 · 数字与字词</small></span>
        <span aria-hidden="true">➜</span>
      </button>
    </main>

    <main id="view-preschool" class="view hidden" aria-label="小小乐园">
      <div class="preschool-top">
        <button type="button" id="preschool-back" class="icon-btn" aria-label="返回">←</button>
        <h2 id="preschool-title">小小乐园</h2>
        <span id="preschool-progress" aria-label="游戏进度"></span>
      </div>
      <div id="preschool-content"></div>
    </main>

    <!-- 视图 2: 二级学科专区大厅 (具体游戏模式选择) -->
    <main id="view-subject-lobby" class="view hidden">
      <div class="subject-lobby-header">
        <button id="btn-back-main" class="icon-btn" title="返回主页">←</button>
        <div class="subject-title-box">
          <h2 id="subject-lobby-title">数学岛</h2>
          <p id="subject-lobby-desc" class="hidden"></p>
        </div>
      </div>

      <!-- 数学关卡卡片网格 -->
      <div class="portal-grid" id="grid-math-modes">
        <!-- 100以内加法 -->
        <button type="button" class="portal-card add" data-mode="add">
          <span class="card-icon">🍎</span>
          <div class="card-title">收苹果</div>
        </button>

        <!-- 100以内减法 -->
        <button type="button" class="portal-card sub" data-mode="sub">
          <span class="card-icon">📦</span>
          <div class="card-title">松鼠拆箱</div>
        </button>

        <!-- 表内乘法 -->
        <button type="button" class="portal-card mul" data-mode="mul">
          <span class="card-icon">🍪</span>
          <div class="card-title">烤饼干</div>
        </button>

        <!-- 表内除法 -->
        <button type="button" class="portal-card div" data-mode="div">
          <span class="card-icon">🍉</span>
          <div class="card-title">分水果</div>
        </button>

        <!-- 综合大挑战 -->
        <button type="button" class="portal-card mix" data-mode="mix">
          <span class="card-icon">🌈</span>
          <div class="card-title">算术挑战</div>
        </button>
      </div>

      <!-- 语文关卡卡片网格 -->
      <div class="portal-grid hidden" id="grid-chinese-modes">
        <!-- 语文模块 1: 成语故事 -->
        <button type="button" class="portal-card idiom" data-mode="idiom">
          <span class="card-icon">🎭</span>
          <div class="card-title">成语故事</div>
        </button>

        <!-- 语文模块 2: 画中找诗 -->
        <button type="button" class="portal-card poem" data-mode="poem">
          <span class="card-icon">🎨</span>
          <div class="card-title">画中找诗</div>
        </button>
      </div>

      <!-- 英语关卡卡片网格 -->
      <div class="portal-grid hidden" id="grid-english-modes">
        <!-- 英语模块 1: 帮帮小动物 -->
        <button type="button" class="portal-card english-story" data-mode="english_story">
          <span class="card-icon">🐾</span>
          <div class="card-title">帮帮小动物</div>
        </button>
      </div>
    </main>

    <!-- 视图 3: 答题挑战舞台 -->
    <main id="view-quiz" class="view hidden">
      <div class="quiz-header">
        <div class="quiz-mode-title" id="quiz-title">
          <span>收苹果</span>
        </div>
        <div class="badge-item" id="quiz-progress">第 1 / 10 题</div>
      </div>

      <!-- 倒计时进度条 -->
      <div class="timer-bar-container" id="timer-bar-container">
        <div id="timer-bar" class="timer-bar-fill"></div>
      </div>

      <!-- 现实意义与启蒙动画舞台 -->
      <section class="enlighten-stage-wrapper">
        <div id="story-narration" class="story-narration">
          <span class="story-tag">🍎 果园装箱工场</span>
          <span class="story-text">果园大丰收！树上摘了 28 个苹果，小鹿又送来 15 个...</span>
        </div>
        <div id="visual-stage" class="visual-stage">
          <!-- 动态渲染生活场景与动画 -->
        </div>
      </section>

      <!-- 算式展示台 -->
      <div class="question-stage">
        <div id="streak-cheer" class="streak-cheer">连中三元！🎉</div>
        <div id="question-formula" class="question-formula">38 + 27 = ?</div>
      </div>

      <!-- 4 选 1 糖果按键 -->
      <div class="options-grid">
        <button class="option-btn btn-0" data-idx="0">65</button>
        <button class="option-btn btn-1" data-idx="1">55</button>
        <button class="option-btn btn-2" data-idx="2">64</button>
        <button class="option-btn btn-3" data-idx="3">75</button>
      </div>

      <!-- 探索模式主动推进按键 -->
      <div id="quiz-advance-box" class="quiz-advance-box hidden">
        <button type="button" id="btn-next-question" class="btn-advance-action">下一车 ➔</button>
      </div>
    </main>

    <!-- 弹窗 1: 智慧小锦囊 (错多或超时触发) -->
    <div id="modal-hint" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="hint-icon">🦉</div>
        <div class="hint-title">智慧小锦囊</div>
        <div id="hint-text" class="hint-content">
          别灰心！想一想乘法口诀：「六八四十八」！
        </div>
        <button id="btn-close-hint" class="btn-primary">我知道啦，继续答题！✨</button>
      </div>
    </div>

    <!-- 弹窗 2: 关卡通关结算 -->
    <div id="modal-summary" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="hint-icon">🏆</div>
        <div class="hint-title">挑战完成！</div>
        <div id="summary-stars" class="result-stars">⭐⭐⭐</div>
        <p id="summary-encourage" style="font-weight: 700; color: #4b5563; margin-bottom: 12px;">太神啦！你简直是数学小天才！</p>
        
        <div class="result-stat-row">
          <div class="stat-item">
            <span class="val" id="summary-correct">10/10</span>
            <span class="lbl">完成题数</span>
          </div>
          <div class="stat-item">
            <span class="val" id="summary-combo">5</span>
            <span class="lbl">最高连击</span>
          </div>
          <div class="stat-item">
            <span class="val" id="summary-score">+30</span>
            <span class="lbl">赢得金星</span>
          </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 10px;">
          <button id="btn-replay" class="btn-primary" style="background: #10b981; border-color: #047857;">再玩一次 🔁</button>
          <button id="btn-back-lobby" class="btn-primary">返回大厅 🏝️</button>
        </div>
      </div>
    </div>

    <!-- 页面底部作者与开源信息 -->
    <footer class="app-footer">
      <div class="footer-meta">
        <span>🏝️ <strong>乐学萌岛</strong> · 纯静态儿童学习游戏</span>
        <span class="sep">•</span>
        <span>作者: <a href="https://github.com/tisyang" target="_blank" rel="noopener noreferrer" class="footer-link">@tisyang</a></span>
        <span class="sep">•</span>
        <a href="https://github.com/tisyang/study-games" target="_blank" rel="noopener noreferrer" class="footer-link repo-tag">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub 源码
        </a>
      </div>
    </footer>
  </div>

  <!-- 引入脚本 -->
  <script src="js/audio.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/chinese_data.js"></script>
  <script src="js/english_data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/visual.js"></script>
  <script src="js/chinese_visual.js"></script>
  <script src="js/english_visual.js"></script>
  <script src="js/app.js"></script>
  <script src="js/preschool_data.js"></script>
  <script src="js/preschool.js"></script>
</body>
</html>
